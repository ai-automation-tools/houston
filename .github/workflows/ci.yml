# Lint and unit tests on every push and pull request. The tests cover src/shared/ and
# need no Electron binary, so the download is skipped; the smoke run needs a desktop
# session and stays a local command (see AGENTS.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: node-pty's prebuilt binary isn't needed by the tests either.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      # Warns, never fails: rebuilding needs Chrome + Archify, which CI doesn't have, and the
      # homepage copies live in another repo (--no-site). A warning means code cited by
      # docs/diagrams/app-architecture.json changed since its pinned commit;
      # docs/diagrams/README.md says how to update it.
      - name: Diagram drift
        if: runner.os == 'Linux'
        run: node scripts/build-diagram.mjs --hook --no-site | sed 's/^ISSUE:/::warning title=Diagram drift::ISSUE:/'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # adm-zip (via electron-chrome-web-store) is pinned to a patched release by the
      # package.json override. See docs/decisions/adr-001-electron-shell.md.
      # The whole graph: Electron is a devDependency but it's the runtime that ships.
      - run: npm audit
