# The demo is OFFLINE since 2026-11-12, while Houston is rebuilt as an agent harness.
# This publishes a one-page "offline" notice to https://houston-demo.ai-automation-tools.dev/
# instead of the demo. The address stays published on purpose: its DNS record still points at
# GitHub Pages, and an unpublished custom domain can be claimed by someone else's repo.
#
# To bring the demo back: restore the build job from git history (setup-node, `npm ci
# --ignore-scripts`, `npm run demo`, upload `_site`). The demo's source is still in src/demo/.
name: Pages

on:
  push:
    branches: [main]
    paths: ['scripts/demo-offline/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every path gets the notice, not GitHub's stock 404.
      - run: cp scripts/demo-offline/index.html scripts/demo-offline/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/demo-offline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
