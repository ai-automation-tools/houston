<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Houston demo: offline</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#060606" />
  <style>
    :root { color-scheme: dark; --bg: #060606; --fg: #f4f4f5; --fg-3: #a1a1aa; --accent: #a3e635;
            --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #fafafa; --fg: #09090b; --fg-3: #52525b; --accent: #4d7c0f; } }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }
    main { max-width: 52ch; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    p { color: var(--fg-3); overflow-wrap: anywhere; }
    a { color: var(--accent); font-family: var(--mono); font-size: 14px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>The Houston demo is offline</h1>
    <p>Houston is being rebuilt as an agent harness. The browser demo will come back when that build is ready to show.</p>
    <p><a href="https://houston.ai-automation-tools.dev/">← Houston homepage</a></p>
  </main>
</body>
</html>
