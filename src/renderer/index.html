<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: crx:; connect-src 'self'; font-src 'self' data:">
  <title>Houston</title>
  <link rel="stylesheet" href="vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Sidebar">
      <header class="side-head">
        <button id="workspace" class="brand" aria-haspopup="menu" title="Workspace: switch, or remove this one. Right-click a folder in Files to add one">🧭 Houston</button>
        <span id="hub-status" class="dot" title="Project Hub: checking… Click for Connections." role="button" tabindex="0" aria-label="Connections"></span>
      </header>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search files, bookmarks, recent  (Ctrl+Shift+F)" autocomplete="off" spellcheck="false">
      </div>
      <nav class="side-tabs" role="tablist">
        <button role="tab" data-panel="files" aria-selected="true">Files</button>
        <button role="tab" data-panel="bookmarks" aria-selected="false">Bookmarks</button>
        <button role="tab" data-panel="recent" aria-selected="false">Recent</button>
        <button role="tab" data-panel="mcp" aria-selected="false" title="Calls agents made to the app's MCP server">MCP</button>
        <button role="tab" data-panel="cron" aria-selected="false" title="Cronsole's scheduled tasks">Cron</button>
        <button role="tab" data-panel="git" aria-selected="false" title="The workspace repo's branch and changes">Git</button>
        <button role="tab" data-panel="dev" aria-selected="false" title="Dev servers from the workspace's package.json">Dev</button>
      </nav>
      <section id="panel-files" class="panel" role="tabpanel"></section>
      <section id="panel-bookmarks" class="panel" role="tabpanel" hidden>
        <div class="panel-tools">
          <select id="bookmark-source" aria-label="Bookmark source"></select>
        </div>
        <div id="bookmark-tree"></div>
      </section>
      <section id="panel-recent" class="panel" role="tabpanel" hidden></section>
      <section id="panel-mcp" class="panel" role="tabpanel" hidden>
        <div class="panel-tools">
          <input id="runs-search" type="search" placeholder="Search past runs: command, folder, output, files" aria-label="Search past runs" autocomplete="off" spellcheck="false">
        </div>
        <div id="mcp-list" aria-live="polite"></div>
      </section>
      <section id="panel-cron" class="panel" role="tabpanel" hidden>
        <div class="panel-tools cron-tools">
          <button id="cron-open" title="Cronsole's UI in the pinned tab">Open Cronsole</button>
          <button id="cron-refresh" title="Ask Cronsole again">Refresh</button>
          <button id="cron-docs" aria-pressed="false" title="Docs upkeep: only the tasks that keep docs current (doc, readme, changelog or diagram in the name). Click one for its last runs and reports">Docs</button>
        </div>
        <div id="cron-list"></div>
      </section>
      <section id="panel-git" class="panel" role="tabpanel" hidden>
        <div class="panel-tools git-tools">
          <span id="git-branch" class="git-branch"></span>
          <button id="git-refresh" title="Ask git again">Refresh</button>
        </div>
        <div id="git-list"></div>
      </section>
      <section id="panel-dev" class="panel" role="tabpanel" aria-live="polite" hidden>
        <div class="panel-tools git-tools">
          <span id="dev-folder" class="git-branch"></span>
          <button id="dev-refresh" title="Read package.json again">Refresh</button>
        </div>
        <div id="dev-list"></div>
      </section>
      <section id="panel-search" class="panel" role="region" aria-label="Search results" hidden></section>
    </aside>

    <div id="side-split" class="splitter vertical" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize sidebar"></div>

    <main id="main">
      <div id="tabstrip" role="tablist" aria-label="Browser tabs">
        <div id="tab-list"></div>
        <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab">＋</button>
      </div>
      <div id="navbar">
        <button class="icon-btn" data-cmd="back" title="Back" aria-label="Back">←</button>
        <button class="icon-btn" data-cmd="forward" title="Forward" aria-label="Forward">→</button>
        <button class="icon-btn" data-cmd="reload" title="Reload (F5)" aria-label="Reload">⟳</button>
        <form id="address-form">
          <input id="address" type="text" placeholder="Search or enter address  (Alt+D)" autocomplete="off" spellcheck="false" aria-label="Address">
        </form>
        <button id="star" class="icon-btn" title="Add to Project Hub favorites" aria-label="Add to Project Hub favorites" aria-pressed="false" hidden>☆</button>
        <form id="find-form" role="search" aria-label="Find in page" hidden>
          <input id="find-input" type="text" placeholder="Find in page" autocomplete="off" spellcheck="false" aria-label="Find in page">
          <span id="find-count" aria-live="polite"></span>
          <button type="button" id="find-prev" class="icon-btn" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
          <button type="button" id="find-next" class="icon-btn" title="Next match (Enter)" aria-label="Next match">↓</button>
          <button type="button" id="find-close" class="icon-btn" title="Close (Escape)" aria-label="Close find">×</button>
        </form>
        <div id="actions-host"></div>
        <button id="open-external" class="icon-btn" title="Open in default browser" aria-label="Open in default browser">↗</button>
        <button id="chat-toggle" class="icon-btn" title="Chat (Ctrl+Shift+L)" aria-label="Chat" aria-pressed="false">💬</button>
      </div>
      <div id="content">
        <div id="empty" class="empty">
          <h1>🧭 Houston</h1>
          <p>Pick a file in the sidebar, or type an address above.</p>
          <div id="quick-links"></div>
        </div>
      </div>
      <div id="term-split" class="splitter horizontal" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize terminal"></div>
      <section id="terminal-panel" aria-label="Terminal">
        <div class="term-head">
          <div id="term-tabs" role="tablist" aria-label="Terminals"></div>
          <button id="term-new" class="icon-btn" title="New terminal (Ctrl+Shift+`)" aria-label="New terminal">＋</button>
          <button id="term-shells" class="icon-btn" title="New terminal with…" aria-label="Choose a shell for a new terminal" aria-haspopup="menu">⌄</button>
          <button id="term-toggle" class="icon-btn" title="Hide terminal (Ctrl+`)" aria-label="Hide terminal">▾</button>
        </div>
        <div id="confirm-bar" role="alertdialog" aria-labelledby="confirm-label" aria-describedby="confirm-cmd" hidden>
          <span id="confirm-label">An agent wants to run this in <b id="confirm-where"></b>:</span>
          <code id="confirm-cmd"></code>
          <button id="confirm-run">Run</button>
          <button id="confirm-deny">Deny</button>
        </div>
        <div id="term-host"></div>
      </section>
    </main>

    <div id="chat-split" class="splitter vertical" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize chat"></div>

    <aside id="chat-pane" aria-label="Chat with Claude">
      <section id="panel-chat" aria-label="Chat">
        <div id="chat-convs-bar">
          <button type="button" id="chat-conv-title" aria-expanded="false" aria-controls="chat-convs" title="This workspace's conversations">New conversation</button>
          <button type="button" id="chat-new" title="Start a new conversation; this one stays in the list">New</button>
          <button type="button" id="chat-hide" class="icon-btn" title="Hide chat (Ctrl+Shift+L)" aria-label="Hide chat">×</button>
        </div>
        <div id="chat-convs" hidden>
          <input id="chat-conv-search" type="search" placeholder="Search this workspace's conversations" aria-label="Search conversations" autocomplete="off">
          <div id="chat-conv-list" role="list"></div>
        </div>
        <div id="chat-log" aria-live="polite"></div>
        <form id="chat-form">
          <div id="chat-tray" hidden aria-label="Attached to your next message">
            <div id="chat-tray-items"></div>
            <div id="chat-tray-dest"></div>
          </div>
          <textarea id="chat-input" rows="3" placeholder="Ask Claude to open a tab, find a file, run a command…  (Enter sends, Shift+Enter for a new line)" aria-label="Chat message" spellcheck="true"></textarea>
          <div class="chat-actions">
            <button type="button" id="chat-attach-page" class="chat-attach" title="Read the active tab's text now and attach it to your next message">+ page</button>
            <button type="button" id="chat-attach-terminal" class="chat-attach" title="Read the showing terminal's last lines now and attach them to your next message">+ terminal</button>
            <span id="chat-model"></span>
            <button type="submit" id="chat-send">Send</button>
            <button type="button" id="chat-stop" hidden title="Stop the answer; a pending Run prompt is withdrawn">Stop</button>
          </div>
        </form>
      </section>
    </aside>
  </div>
  <dialog id="connections" aria-labelledby="connections-title">
    <div class="conn-head">
      <h2 id="connections-title">Connections</h2>
      <button type="button" id="connections-recheck">Check all</button>
      <button type="button" id="connections-close" aria-label="Close">×</button>
    </div>
    <div id="connections-list"></div>
  </dialog>
  <dialog id="palette" aria-label="Command palette">
    <input id="palette-input" type="text" placeholder="Actions, workspaces, tabs, terminals, files…  (↑↓ to pick, Enter to go, Esc to close)" autocomplete="off" spellcheck="false" role="combobox" aria-controls="palette-list" aria-expanded="true" aria-autocomplete="list">
    <div id="palette-list" role="listbox" aria-label="Matches"></div>
  </dialog>
</body>
</html>
