<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: crx:; connect-src 'self'; font-src 'self' data:">
  <title>Houston</title>
  <link rel="stylesheet" href="vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Sidebar">
      <header class="side-head">
        <button id="workspace" class="brand" aria-haspopup="menu" title="Workspace: switch, or remove this one. Right-click a folder in Files to add one">🧭 Houston</button>
        <span id="hub-status" class="dot" title="Project Hub: checking… Click for Connections." role="button" tabindex="0" aria-label="Connections"></span>
      </header>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search files, bookmarks, recent  (Ctrl+Shift+F)" autocomplete="off" spellcheck="false">
      </div>
      <nav class="side-tabs" role="tablist">
        <button role="tab" data-panel="files" aria-selected="true" title="Files" aria-label="Files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
        <button role="tab" data-panel="bookmarks" aria-selected="false" title="Bookmarks" aria-label="Bookmarks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
        <button role="tab" data-panel="recent" aria-selected="false" title="Recent" aria-label="Recent"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
        <button role="tab" data-panel="news" aria-selected="false" title="News: Headlines from the feeds and Markdown sources in settings.json" aria-label="News"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg></button>
        <button role="tab" data-panel="feed" aria-selected="false" title="Feed: The feed index: categories with what belongs in each, bookmarks, MCP servers to add as discovered" aria-label="Feed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"/><circle cx="6" cy="18" r="1.5"/></svg></button>
        <button role="tab" data-panel="mcp" aria-selected="false" title="MCP: Calls agents made to the app's MCP server" aria-label="MCP"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg></button>
        <button role="tab" data-panel="cron" aria-selected="false" title="Cron: Cronsole's scheduled tasks" aria-label="Cron"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
        <button role="tab" data-panel="git" aria-selected="false" title="Git: The workspace repo's branch and changes" aria-label="Git"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9a6 6 0 0 1-6 6H8"/></svg></button>
        <button role="tab" data-panel="dev" aria-selected="false" title="Dev: Dev servers from the workspace's package.json" aria-label="Dev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/></svg></button>
        <button role="tab" data-panel="agents" aria-selected="false" title="Agents: Agent identities and their contained sessions, from the Houston Core" aria-label="Agents"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4M9 13v2M15 13v2"/></svg></button>
        <button role="tab" data-panel="logs" aria-selected="false" title="Logs: The Houston Core's audit log: what each agent did and what was decided" aria-label="Logs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        <button role="tab" data-panel="integrations" aria-selected="false" title="Integrations: MCP servers behind the Core's gateway, the vault's secret names, and agent backends" aria-label="Integrations"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 14v7M14 17.5h7"/></svg></button>
        <button id="side-more" class="side-more" title="More tabs" aria-label="More tabs" aria-haspopup="menu" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l5 5-5 5M13 7l5 5-5 5"/></svg></button>
      </nav>
      <section id="panel-files" class="panel" role="tabpanel"></section>
      <section id="panel-bookmarks" class="panel" role="tabpanel" hidden>
        <div class="panel-tools">
          <select id="bookmark-source" aria-label="Bookmark source"></select>
        </div>
        <div id="bookmark-tree"></div>
      </section>
      <section id="panel-recent" class="panel" role="tabpanel" hidden></section>
      <section id="panel-news" class="panel" role="tabpanel" hidden>
        <div class="panel-tools git-tools">
          <span id="news-sources" class="git-branch"></span>
          <button id="news-refresh" title="Fetch every source again">Refresh</button>
        </div>
        <div id="news-list"></div>
      </section>
      <section id="panel-feed" class="panel" role="tabpanel" hidden>
        <div class="panel-tools git-tools">
          <span id="feed-when" class="git-branch"></span>
          <button id="feed-start" title="Open the start page: advisories, approvals, overnight runs, highlights">Start page</button>
          <button id="feed-refresh" title="Read the feed index again">Refresh</button>
        </div>
        <div id="feed-list"></div>
      </section>
      <section id="panel-mcp" class="panel" role="tabpanel" hidden>
        <div class="panel-tools">
          <input id="runs-search" type="search" placeholder="Search past runs: command, folder, output, files" aria-label="Search past runs" autocomplete="off" spellcheck="false">
        </div>
        <div id="mcp-list" aria-live="polite"></div>
      </section>
      <section id="panel-cron" class="panel" role="tabpanel" hidden>
        <div class="panel-tools cron-tools">
          <button id="cron-open" title="Cronsole's UI in the pinned tab">Open Cronsole</button>
          <button id="cron-refresh" title="Ask Cronsole again">Refresh</button>
          <button id="cron-docs" aria-pressed="false" title="Docs upkeep: only the tasks that keep docs current (doc, readme, changelog or diagram in the name). Click one for its last runs and reports">Docs</button>
          <button id="cron-failed" aria-pressed="false" title="Only the active tasks whose last run failed">Failed</button>
        </div>
        <div class="panel-tools cron-find">
          <input id="cron-filter" type="search" placeholder="Filter tasks by name" aria-label="Filter tasks by name" autocomplete="off" spellcheck="false">
          <span id="cron-count" class="sub" aria-live="polite"></span>
        </div>
        <div id="cron-list"></div>
      </section>
      <section id="panel-git" class="panel" role="tabpanel" hidden>
        <div class="panel-tools git-tools">
          <span id="git-branch" class="git-branch"></span>
          <button id="git-refresh" title="Ask git again">Refresh</button>
        </div>
        <div id="git-list"></div>
      </section>
      <section id="panel-dev" class="panel" role="tabpanel" aria-live="polite" hidden>
        <div class="panel-tools git-tools">
          <span id="dev-folder" class="git-branch"></span>
          <button id="dev-refresh" title="Read package.json again">Refresh</button>
        </div>
        <div id="dev-list"></div>
      </section>
      <section id="panel-agents" class="panel" role="tabpanel" aria-live="polite" hidden>
        <div class="panel-tools git-tools">
          <span id="agents-folder" class="git-branch"></span>
          <button id="agents-identities" title="Every identity: attributes, grants, sessions, review dates and what it can reach">Identities</button>
          <button id="agents-refresh" title="Ask the Core again">Refresh</button>
        </div>
        <div id="agents-list"></div>
      </section>
      <section id="panel-logs" class="panel" role="tabpanel" hidden>
        <div class="panel-tools log-tools">
          <select id="logs-identity" aria-label="Identity"><option value="">Every identity</option></select>
          <select id="logs-session" aria-label="Session"><option value="">Every session</option></select>
          <select id="logs-result" aria-label="Decision"><option value="">Every decision</option><option value="allow">Allowed</option><option value="ask">Asked</option><option value="deny">Denied</option></select>
          <button id="logs-refresh" title="Read the audit log again">Refresh</button>
        </div>
        <div id="logs-list" aria-live="polite"></div>
      </section>
      <section id="panel-integrations" class="panel" role="tabpanel" aria-live="polite" hidden>
        <div class="panel-tools git-tools">
          <span class="git-branch">Core gateway</span>
          <button id="integrations-refresh" title="Ask the Core again">Refresh</button>
        </div>
        <div id="integrations-list"></div>
      </section>
      <section id="panel-search" class="panel" role="region" aria-label="Search results" hidden></section>
      <footer class="side-foot">
        <button id="settings-open" class="side-foot-btn" title="Settings (Ctrl+,)" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</button>
      </footer>
    </aside>

    <div id="side-split" class="splitter vertical" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize sidebar"></div>

    <main id="main">
      <div id="tabstrip" role="tablist" aria-label="Browser tabs">
        <div id="tab-list"></div>
        <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab">＋</button>
      </div>
      <div id="navbar">
        <button class="icon-btn" data-cmd="back" title="Back" aria-label="Back">←</button>
        <button class="icon-btn" data-cmd="forward" title="Forward" aria-label="Forward">→</button>
        <button class="icon-btn" data-cmd="reload" title="Reload (F5)" aria-label="Reload">⟳</button>
        <form id="address-form">
          <input id="address" type="text" placeholder="Search or enter address  (Alt+D)" autocomplete="off" spellcheck="false" aria-label="Address" role="combobox" aria-controls="address-suggest" aria-expanded="false" aria-autocomplete="list">
          <div id="address-suggest" role="listbox" aria-label="Suggestions from Recent and bookmarks" hidden></div>
        </form>
        <button id="star" class="icon-btn" title="Add to Project Hub favorites" aria-label="Add to Project Hub favorites" aria-pressed="false" hidden>☆</button>
        <form id="find-form" role="search" aria-label="Find in page" hidden>
          <input id="find-input" type="text" placeholder="Find in page" autocomplete="off" spellcheck="false" aria-label="Find in page">
          <span id="find-count" aria-live="polite"></span>
          <button type="button" id="find-prev" class="icon-btn" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
          <button type="button" id="find-next" class="icon-btn" title="Next match (Enter)" aria-label="Next match">↓</button>
          <button type="button" id="find-close" class="icon-btn" title="Close (Escape)" aria-label="Close find">×</button>
        </form>
        <div id="actions-host"></div>
        <button id="open-external" class="icon-btn" title="Open in default browser" aria-label="Open in default browser">↗</button>
        <button id="chat-toggle" class="icon-btn" title="Chat (Ctrl+Shift+L)" aria-label="Chat" aria-pressed="false">💬</button>
        <button id="stop-all" title="End every agent session the Core is running, at once (Ctrl+Shift+Backspace; also in the tray menu)">⏹ Stop All</button>
      </div>
      <div id="content">
        <section id="prefs" class="prefs" aria-labelledby="prefs-title" hidden>
          <header class="prefs-head">
            <h1 id="prefs-title">Settings</h1>
            <span id="prefs-status" class="prefs-status" role="status" aria-live="polite"></span>
            <button id="prefs-close" class="icon-btn" title="Close (Esc)" aria-label="Close settings">✕</button>
          </header>
          <div class="prefs-body">
            <nav class="prefs-nav" aria-label="Settings sections">
              <a href="#prefs-general">General</a>
              <a href="#prefs-browser">Browser</a>
              <a href="#prefs-files">Files</a>
              <a href="#prefs-startup">Startup</a>
              <a href="#prefs-sources">Sources</a>
              <a href="#prefs-hub">Project Hub</a>
              <a href="#prefs-security">Agents and security</a>
            </nav>
            <div id="prefs-main" class="prefs-main"></div>
          </div>
        </section>
        <div id="empty" class="empty">
          <h1>🧭 Houston</h1>
          <p>Pick a file in the sidebar, or type an address above.</p>
          <div id="quick-links"></div>
        </div>
      </div>
      <div id="term-split" class="splitter horizontal" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize terminal"></div>
      <section id="terminal-panel" aria-label="Terminal">
        <div class="term-head">
          <div id="term-tabs" role="tablist" aria-label="Terminals"></div>
          <button id="term-new" class="icon-btn" title="New terminal (Ctrl+Shift+`)" aria-label="New terminal">＋</button>
          <button id="term-shells" class="icon-btn" title="New terminal with…" aria-label="Choose a shell for a new terminal" aria-haspopup="menu">⌄</button>
          <button id="term-toggle" class="icon-btn" title="Hide terminal (Ctrl+`)" aria-label="Hide terminal">▾</button>
        </div>
        <div id="confirm-bar" role="alertdialog" aria-labelledby="confirm-label" aria-describedby="confirm-cmd" hidden>
          <span id="confirm-label">An agent wants to run this in <b id="confirm-where"></b>:</span>
          <code id="confirm-cmd"></code>
          <button id="confirm-run">Run</button>
          <button id="confirm-deny">Deny</button>
        </div>
        <div id="approval-bar" role="alertdialog" aria-labelledby="approval-label" aria-describedby="approval-what" hidden>
          <span id="approval-label">🛡 <b id="approval-who"></b> wants to</span>
          <code id="approval-what"></code>
          <span id="approval-where" class="approval-meta"></span>
          <span id="approval-left" class="approval-meta" title="Unanswered, it's denied when this reaches 0"></span>
          <button id="approval-once" title="Allow this one request">Allow once</button>
          <button id="approval-session" title="Allow this and the same request again until the session ends">Allow for this session</button>
          <button id="approval-deny">Deny</button>
        </div>
        <div id="term-host"></div>
      </section>
    </main>

    <div id="chat-split" class="splitter vertical" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize chat"></div>

    <aside id="chat-pane" aria-label="Chat with Claude">
      <section id="panel-chat" aria-label="Chat">
        <div id="chat-convs-bar">
          <button type="button" id="chat-conv-title" aria-expanded="false" aria-controls="chat-convs" title="This workspace's conversations">New conversation</button>
          <button type="button" id="chat-new" title="Start a new conversation; this one stays in the list">New</button>
          <button type="button" id="chat-hide" class="icon-btn" title="Hide chat (Ctrl+Shift+L)" aria-label="Hide chat">×</button>
        </div>
        <div id="chat-convs" hidden>
          <input id="chat-conv-search" type="search" placeholder="Search this workspace's conversations" aria-label="Search conversations" autocomplete="off">
          <div id="chat-conv-list" role="list"></div>
        </div>
        <div id="chat-log" aria-live="polite"></div>
        <form id="chat-form">
          <div id="chat-tray" hidden aria-label="Attached to your next message">
            <div id="chat-tray-items"></div>
            <div id="chat-tray-dest"></div>
          </div>
          <textarea id="chat-input" rows="3" placeholder="Ask Claude to open a tab, find a file, run a command…  (Enter sends, Shift+Enter for a new line)" aria-label="Chat message" spellcheck="true"></textarea>
          <div class="chat-actions">
            <button type="button" id="chat-attach-page" class="chat-attach" title="Read the active tab's text now and attach it to your next message">+ page</button>
            <button type="button" id="chat-attach-terminal" class="chat-attach" title="Read the showing terminal's last lines now and attach them to your next message">+ terminal</button>
            <span id="chat-model"></span>
            <button type="submit" id="chat-send">Send</button>
            <button type="button" id="chat-stop" hidden title="Stop the answer; a pending Run prompt is withdrawn">Stop</button>
          </div>
        </form>
      </section>
    </aside>
  </div>
  <dialog id="connections" aria-labelledby="connections-title">
    <div class="conn-head">
      <h2 id="connections-title">Connections</h2>
      <button type="button" id="connections-recheck">Check all</button>
      <button type="button" id="connections-close" aria-label="Close">×</button>
    </div>
    <div id="connections-list"></div>
  </dialog>
  <dialog id="palette" aria-label="Command palette">
    <input id="palette-input" type="text" placeholder="Actions, workspaces, tabs, terminals, files…  (↑↓ to pick, Enter to go, Esc to close)" autocomplete="off" spellcheck="false" role="combobox" aria-controls="palette-list" aria-expanded="true" aria-autocomplete="list">
    <div id="palette-list" role="listbox" aria-label="Matches"></div>
  </dialog>
</body>
</html>
